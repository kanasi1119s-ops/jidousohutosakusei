name: invoice-credit-calculator CI

on:
  push:
    branches: ['**']
    paths:
      - 'projects/invoice-credit-calculator/**'
      - '.github/workflows/invoice-credit-calculator-ci.yml'
  pull_request:
    paths:
      - 'projects/invoice-credit-calculator/**'
      - '.github/workflows/invoice-credit-calculator-ci.yml'

defaults:
  run:
    working-directory: projects/invoice-credit-calculator

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/invoice-credit-calculator/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-credit-calculator-dist
          path: projects/invoice-credit-calculator/dist
