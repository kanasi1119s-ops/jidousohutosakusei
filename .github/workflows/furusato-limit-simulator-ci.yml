name: furusato-limit-simulator CI

on:
  push:
    branches: ['**']
    paths:
      - 'projects/furusato-limit-simulator/**'
      - '.github/workflows/furusato-limit-simulator-ci.yml'
  pull_request:
    paths:
      - 'projects/furusato-limit-simulator/**'
      - '.github/workflows/furusato-limit-simulator-ci.yml'

defaults:
  run:
    working-directory: projects/furusato-limit-simulator

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/furusato-limit-simulator/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
