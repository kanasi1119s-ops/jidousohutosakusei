name: withholding-tax-calculator CI

on:
  push:
    branches: ['**']
    paths:
      - 'projects/withholding-tax-calculator/**'
      - '.github/workflows/withholding-tax-calculator-ci.yml'
  pull_request:
    paths:
      - 'projects/withholding-tax-calculator/**'
      - '.github/workflows/withholding-tax-calculator-ci.yml'

defaults:
  run:
    working-directory: projects/withholding-tax-calculator

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/withholding-tax-calculator/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
