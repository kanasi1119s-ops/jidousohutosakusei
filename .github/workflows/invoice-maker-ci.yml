name: invoice-maker CI

on:
  push:
    branches: ['**']
    paths:
      - 'projects/invoice-maker/**'
      - '.github/workflows/invoice-maker-ci.yml'
  pull_request:
    paths:
      - 'projects/invoice-maker/**'
      - '.github/workflows/invoice-maker-ci.yml'

defaults:
  run:
    working-directory: projects/invoice-maker

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/invoice-maker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-maker-dist
          path: projects/invoice-maker/dist
